<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Trivia Battle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#10131a;color:#f5f7fb;min-height:100vh;display:flex;justify-content:center;padding:24px}.app{width:min(760px,100%)}.card{background:#191e29;border:1px solid #303849;border-radius:20px;padding:26px}.screen{display:none}.active{display:block}.brand{font-size:34px;font-weight:900}.muted{color:#9ca8ba}.grid{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}input{width:100%;padding:14px;border-radius:12px;border:1px solid #3a4355;background:#11151d;color:#fff;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6d5dfc;color:white;font-weight:800;font-size:16px;cursor:pointer}button.secondary{background:#2a3140}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.code{font-size:42px;font-weight:900;letter-spacing:8px;text-align:center;padding:18px;background:#11151d;border-radius:16px;margin:20px 0}.players,.leader{display:grid;gap:8px;margin:18px 0}.player,.rank{padding:12px 14px;background:#222938;border-radius:12px}.player{display:flex;justify-content:space-between}.rank{display:grid;grid-template-columns:42px 1fr auto;gap:10px}.timer{font-size:44px;font-weight:900}.question{font-size:27px;font-weight:800;margin:20px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{text-align:left;background:#252d3d}.selected{outline:3px solid #6d5dfc}.error{color:#ff8e9b;margin-top:10px}.winner{text-align:center;font-size:28px;font-weight:900}.spacer{height:16px}.small{font-size:13px}@media(max-width:560px){.answers{grid-template-columns:1fr}.brand{font-size:28px}}
</style></head><body><main class=app><div class=card>
<section id=home class="screen active"><div class=brand>⚡ Trivia Battle</div><p class=muted>2–8 players · 5 questions · 15 seconds each</p><form id=create class=grid><input id=cname maxlength=18 placeholder="Your name" required><button>Create room</button></form><div class=spacer></div><form id=join class=grid><input id=jcode maxlength=6 placeholder="Room code" required><input id=jname maxlength=18 placeholder="Your name" required><button class=secondary>Join room</button></form><div id=msg class=error></div></section>
<section id=lobby class=screen><div class=row><div><div class=brand>Waiting room</div><div class=muted>Share this code with friends</div></div><strong id=count></strong></div><div id=code class=code></div><div id=players class=players></div><button id=start>Start game</button><div id=lmsg class=error></div></section>
<section id=question class=screen><div class=row><strong id=qnum></strong><div id=timer class=timer>15</div></div><div id=qtext class=question></div><div id=answers class=answers></div><p id=astatus class=muted>Choose one answer. Your first selection is final.</p></section>
<section id=result class=screen><div class=brand>Question result</div><p id=correct class=muted></p><div id=rboard class=leader></div><p class="muted small">Next question starting automatically…</p></section>
<section id=finished class=screen><div id=winner class=winner></div><div class=spacer></div><div id=fboard class=leader></div><button id=home>Back to home</button></section>
</div></main><script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');let me='',host=false,timer=null;const $=x=>document.getElementById(x),show=x=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(x).classList.add('active')};function send(action,o={}){ws.send(JSON.stringify({action,...o}))}function board(a){return a.map((p,i)=>`<div class=rank><b>${i+1}</b><span>${esc(p.name)}${p.id===me?' <small>(you)</small>':''}</span><b>${p.score}</b></div>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('create').onsubmit=e=>{e.preventDefault();me='pending';send('createRoom',{name:$('cname').value.trim()})};$('join').onsubmit=e=>{e.preventDefault();me='pending';send('joinRoom',{code:$('jcode').value.trim().toUpperCase(),name:$('jname').value.trim()})};$('start').onclick=()=>send('startGame');$('home').onclick=()=>location.reload();
ws.onopen=()=>{};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='created'||d.type==='joined'){me=d.id;show('lobby')}else if(d.type==='error'){$('msg').textContent=d.message;$('lmsg').textContent=d.message}else if(d.type==='roomState'){if(me==='pending'){const mine=d.players.find(p=>p.name===($('cname').value.trim()||$('jname').value.trim()));if(mine){me=mine.id}};const mine=d.players.find(p=>p.id===me);host=!!mine?.host;$('code').textContent=d.code;$('count').textContent=d.players.length+'/8';$('players').innerHTML=d.players.map(p=>`<div class=player><span>${p.host?'👑 ':''}${esc(p.name)}${p.id===me?' <small>(you)</small>':''}</span><small>${p.connected?'online':'offline'}</small></div>`).join('');$('start').style.display=host?'block':'none';if(d.phase==='lobby')show('lobby')}
else if(d.type==='question'){show('question');$('qnum').textContent=`Question ${d.index+1} / ${d.total}`;$('qtext').textContent=d.text;$('answers').innerHTML=d.answers.map((a,i)=>`<button data-i=${i}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('');$('astatus').textContent='Choose one answer. Your first selection is final.';document.querySelectorAll('#answers button').forEach(b=>b.onclick=()=>{if(b.disabled)return;send('submitAnswer',{answer:+b.dataset.i});document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);b.classList.add('selected');$('astatus').textContent='Answer locked in — waiting for the round to finish.'});clearInterval(timer);const tick=()=>{let left=Math.max(0,d.endsAt-Date.now());$('timer').textContent=Math.ceil(left/1000);if(left<=0)clearInterval(timer)};tick();timer=setInterval(tick,100)}
else if(d.type==='result'){clearInterval(timer);show('result');$('correct').textContent=`Correct answer: ${String.fromCharCode(65+d.correctIndex)}`;$('rboard').innerHTML=board(d.leaderboard)}else if(d.type==='gameOver'){show('finished');$('winner').textContent=`🏆 ${esc(d.winner.name)} wins with ${d.winner.score} points!`;$('fboard').innerHTML=board(d.leaderboard)}};
</script></body></html>
